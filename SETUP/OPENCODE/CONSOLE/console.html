<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BAZER Console</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyByeD0nMTQnIGZpbGw9JyNmNWM1NDInLz48cGF0aCBkPSdNMzIgOCBMNTIuNzggMjAgTDUyLjc4IDQ0IEwzMiA1NiBMMTEuMjIgNDQgTDExLjIyIDIwIFonIGZpbGw9JyMwYTBjMTAnLz48L3N2Zz4="/>
<style>
:root{
  --bg:#0a0c10; --panel:rgba(255,255,255,.032); --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.08); --text:#e8ecf4; --dim:#8b94a7; --dim2:#5d6678;
  --gold:#f5c542; --teal:#4cc9a4; --red:#ff5c5c; --ok:#3ddc84; --warn:#ffb020;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 80% -10%, rgba(245,197,66,.07), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(76,201,164,.06), transparent 60%),
    var(--bg);
  color:var(--text);font:14px/1.55 "Segoe UI","Leelawadee UI",system-ui,sans-serif;
}
.app{display:flex;min-height:100vh}
aside{
  width:224px;flex:none;padding:18px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%);
  border-right:1px solid var(--line);
}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 12px;border-bottom:1px solid var(--line)}
.brand .logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#0a0c10;
  background:linear-gradient(135deg,var(--gold),#ffdf7e);box-shadow:0 0 18px rgba(245,197,66,.35);
}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand i{display:block;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
nav button{
  all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--dim);font-size:13.5px;
  border:1px solid transparent;transition:all .15s ease;position:relative;
}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{
  color:var(--text);background:var(--panel2);border-color:var(--line);
  box-shadow:0 0 0 1px rgba(245,197,66,.25), 0 6px 20px -12px rgba(245,197,66,.5);
}
nav button.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--gold),#ffdf7e)}
nav button.navbazer{color:#ff9a76}
nav button.navbazer:hover{color:#ffc9b5}
nav button.navbazer.on{box-shadow:0 0 0 1px rgba(217,72,15,.45), 0 6px 20px -12px rgba(217,72,15,.85)}
nav button.navbazer.on::before{background:linear-gradient(180deg,#D9480F,#ff9a76)}
nav button.navsnack{color:#7fe8dc}
nav button.navsnack:hover{color:#b3f4ec}
nav button.navsnack.on{box-shadow:0 0 0 1px rgba(64,224,208,.45), 0 6px 20px -12px rgba(64,224,208,.85)}
nav button.navsnack.on::before{background:linear-gradient(180deg,#40E0D0,#7fe8dc)}
.navgroup{font-size:10.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;padding:9px 12px 2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.navgroup .cnt{font-size:10.5px;letter-spacing:0;color:var(--dim2);text-transform:none}
#navModes{display:flex;flex-direction:column;gap:4px}
nav button.agent-tab{display:flex;align-items:center;gap:8px}
nav button.agent-tab .adot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim2)}
nav button.agent-tab .aname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.agent-tab .abadge{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);flex:none}
nav button.agent-tab .awarn{color:var(--warn);border-color:rgba(255,176,32,.4)}
nav button.agent-tab.off{opacity:.45}
nav button.agent-tab.off .aname{text-decoration:line-through}
nav button.agent-tab.miss{opacity:.55}
nav button.agent-tab.miss .aname{font-style:italic}
.foot{display:flex;flex-direction:column;gap:8px}
.pill{
  display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--dim);background:var(--panel);
}
main{flex:1;min-width:0;padding:22px 26px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header h1{font-size:19px;margin:0;letter-spacing:.2px}
.hacts{display:flex;gap:8px}
.btn{
  all:unset;cursor:pointer;border-radius:10px;padding:8px 14px;font-size:13px;text-align:center;
  border:1px solid var(--line);color:var(--text);background:var(--panel2);transition:all .15s ease;
}
.btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffdf7e);color:#14100a;font-weight:600;border-color:transparent;box-shadow:0 6px 22px -10px rgba(245,197,66,.7)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,92,92,.4);color:#ffb3b3}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015) 45%),var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  backdrop-filter:blur(8px);
}
.card h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.card .big{font-size:17px;font-weight:600;letter-spacing:.2px}
.card .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt{margin-top:10px}
.led{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim2);display:inline-block}
.led.ok{background:var(--ok);box-shadow:0 0 10px rgba(61,220,132,.8);animation:pulse 2.4s infinite}
.led.warn{background:var(--warn);box-shadow:0 0 10px rgba(255,176,32,.8)}
.led.fail{background:var(--red);box-shadow:0 0 10px rgba(255,92,92,.8)}
.led.info{background:#5ea2ff;box-shadow:0 0 10px rgba(94,162,255,.6)}
@keyframes pulse{50%{opacity:.55}}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.gold{color:var(--gold);border-color:rgba(245,197,66,.4);background:rgba(245,197,66,.08)}
.badge.ok{color:var(--ok);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.07)}
.badge.warn{color:var(--warn);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.07)}
.badge.red{color:#ffb3b3;border-color:rgba(255,92,92,.35);background:rgba(255,92,92,.07)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;color:#cfe3ff}
.muted{color:var(--dim)}
.small{font-size:12px}
.xs{font-size:11.5px}
input[type=text],textarea,select{
  background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:7px 10px;font:inherit;font-size:13px;outline:none;width:100%;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:rgba(245,197,66,.5);box-shadow:0 0 0 3px rgba(245,197,66,.12)}
textarea{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;min-height:120px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
.switch{position:relative;width:42px;height:23px;flex:none;cursor:pointer}
.switch input{display:none}
.switch i{
  position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.12);
  transition:.18s;border:1px solid var(--line);
}
.switch i::after{
  content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#cfd6e4;transition:.18s;
}
.switch input:checked+i{background:linear-gradient(135deg,var(--gold),#ffdf7e);border-color:transparent}
.switch input:checked+i::after{left:21px;background:#17120a}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ms-other{opacity:.55}
.chip{
  display:inline-flex;gap:6px;align-items:center;padding:3px 6px 3px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--dim);
}
.chip b{color:var(--text);font-weight:500}
.chip button{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:11px}
.chip button:hover{background:rgba(255,92,92,.2);color:#ffb3b3}
.hair{height:1px;background:var(--line);margin:10px 0;border:0}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:400px}
.toast{
  padding:10px 14px;border-radius:11px;font-size:13px;border:1px solid var(--line);
  background:rgba(18,22,30,.95);box-shadow:0 14px 40px -18px rgba(0,0,0,.9);
  animation:fade .2s ease;white-space:pre-wrap;
}
.toast.err{border-color:rgba(255,92,92,.5);color:#ffc9c9}
.toast.ok{border-color:rgba(61,220,132,.4)}
.verify-list{display:flex;flex-direction:column;gap:2px}
.vrow{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);align-items:flex-start}
.vrow:last-child{border-bottom:0}
.vrow .led{margin-top:6px}
.help{font-size:12px;color:var(--dim);background:rgba(94,162,255,.06);border:1px solid rgba(94,162,255,.18);border-radius:10px;padding:8px 12px}
.warnbox{font-size:12px;color:#ffd9a1;background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.25);border-radius:10px;padding:8px 12px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
.section-title{font-size:14px;font-weight:600;margin:8px 0 2px;letter-spacing:.2px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
summary{cursor:pointer;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo">⬢</div>
      <div><b>BAZER</b><i>Console</i></div>
    </div>
    <nav id="nav">
      <button data-tab="dash" class="on">ภาพรวม</button>
      <button data-tab="lock">ล็อก &amp; โมเดล</button>
      <button data-tab="server">Server &amp; Cline</button>
      <button data-tab="pstack">pStack</button>
      <div class="navgroup">โหมดผู้ช่วย <span id="navModesCnt" class="cnt"></span></div>
      <span id="navModes"></span>
      <div class="navgroup">Subagent <span id="navSubCnt" class="cnt"></span></div>
      <span id="navSub"></span>
      <button data-tab="projects">โปรเจกต์</button>
      <button data-tab="plannotator">Plannotator</button>
      <button data-tab="history">ประวัติ &amp; สำรอง</button>
    </nav>
    <div class="foot">
      <div class="pill"><span class="led" id="serverLed"></span><span id="serverPillText">กำลังโหลด…</span></div>
      <button class="btn gold" data-act="verify">⚡ ตรวจความครบ</button>
    </div>
  </aside>
  <main>
    <header>
      <h1 id="hTitle">ภาพรวม</h1>
      <div class="hacts">
        <button class="btn ghost" data-act="refresh">↻ รีเฟรช</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toasts"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let TAB = (()=>{ try { let t = localStorage.getItem('bazerTab') || 'dash'; if(t === 'agent:arena.md') t = 'arena'; if(t === 'agent:buddha.md') t = 'buddha'; return t; } catch { return 'dash'; } })(), S = null, VERIFY = null, MODELS = null, BP = null, FILTER = '', MS = null, AMODELS = null, SETUP = null, UP = null, ROLES = null;

async function api(u, opts={}){
  const r = await fetch(u, {
    method: opts.post ? 'POST' : 'GET',
    headers: { 'x-oc-token': TOKEN, ...(opts.post ? {'content-type':'application/json'} : {}) },
    body: opts.post ? JSON.stringify(opts.post) : undefined,
  });
  if(!r.ok){ let t=''; try{ t = await r.text(); }catch{} throw new Error(t.slice(0,300) || ('HTTP '+r.status)); }
  return r.json();
}

function toast(msg, isErr){
  const d = document.createElement('div');
  d.className = 'toast ' + (isErr ? 'err' : 'ok');
  d.textContent = msg;
  document.getElementById('toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(), 320); }, isErr ? 7000 : 3500);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const led = l => `<span class="led ${l}"></span>`;
const MODE_LABEL = {
  'deepseek-only': ['ล็อกแน่น — deepseek ตัวเดียว', 'ok'],
  'provider-only': ['ล็อก provider เดียว (opencode-go)', 'ok'],
  'off': ['ปลดล็อก (ไฟล์ว่าง)', 'warn'],
  'custom': ['กำหนดเอง', 'info'],
  'none': ['ยังไม่มีไฟล์ล็อก', 'fail'],
};

async function refresh(){
  try{
    S = await api('/api/state');
    render();
  }catch(e){ toast('โหลดสถานะไม่สำเร็จ: ' + e.message, true); }
}

async function act(id, params={}, confirmText){
  if(confirmText && !confirm(confirmText)) return;
  try{
    const r = await api('/api/action', { post: { id, ...params } });
    if(r.ok === false){ toast('ผิดพลาด: ' + (r.message||''), true); }
    else { toast(r.message || 'สำเร็จ'); }
    await refresh();
    const after = ['set-lock','update-blacklist','set-model-effort','save-text','build-apply','skill-hide','skill-show','skill-remove-field','agent-toggle','agent-del','command-toggle','plannotator-toggle','restore-backup','save-pstack-models','save-plannotator-config','save-plannotator-prefs','scan-projects','project-agent-toggle','project-agent-del','project-agent-add','project-init','setup-apply','update-apply','save-agent','pm-role-save','pm-legacy-migrate','pm-legacy-del','mirror-agents','install-agent'];
    if(after.includes(id)) runVerify(false);
  }catch(e){ toast('ผิดพลาด: ' + e.message, true); }
}

async function runVerify(showTab){
  try{
    VERIFY = await api('/api/verify');
    if(showTab !== false) tab('dash'); else render();
  }catch(e){ toast('ตรวจไม่สำเร็จ: ' + e.message, true); }
}

function anyDirty(){ return [...document.querySelectorAll('textarea')].some(t => t.dataset.dirty === '1'); }
function setVerifyBadge(){
  const b = document.querySelector('.foot [data-act="verify"]');
  if(!b) return;
  if(!VERIFY){ b.textContent = '⚡ ตรวจความครบ'; b.className = 'btn gold'; return; }
  const s = VERIFY.summary || {};
  const parts = [];
  if(s.fail) parts.push('✕ ' + s.fail);
  if(s.warn) parts.push('⚠ ' + s.warn);
  b.textContent = '⚡ ตรวจความครบ' + (parts.length ? ' · ' + parts.join(' · ') : ' · ผ่านหมด');
  b.className = 'btn ' + (s.fail ? 'danger' : (s.warn ? '' : 'gold'));
}

function tab(name){
  TAB = name;
  try{ localStorage.setItem('bazerTab', name); }catch{}
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  render();
}

/* ---------- renderers ---------- */

function render(){
  if(!S) return;
  if(TAB === 'pstack' && MS) collectMS();
  const titles = { dash:'ภาพรวม', lock:'ล็อก & โมเดล', server:'Server & Cline', pstack:'pStack', bazer:'Bazer Mode', buddha:'Buddha Mode', arena:'Arena Mode', snack:'Snack', projects:'โปรเจกต์', plannotator:'Plannotator', history:'ประวัติ & สำรอง' };
  const af = TAB.indexOf('agent:') === 0 ? TAB.slice(6) : null;
  const meta = af ? (AGENT_META[af] || { name: af.replace(/\.md$/, '') }) : null;
  document.getElementById('hTitle').textContent = af ? (meta.name + (meta.sub ? ' (subagent)' : ' Mode')) : (titles[TAB] || '');
  const pill = document.getElementById('serverLed');
  const ptext = document.getElementById('serverPillText');
  if(S.server.up){ pill.className = 'led ok'; ptext.textContent = `server 4096 · v${S.server.version||'?'}`; }
  else { pill.className = 'led fail'; ptext.textContent = 'server 4096 ปิดอยู่'; }
  const v = af ? vAgent(af) : ({ dash: vDash, lock: vLock, server: vServer, pstack: vPstack, bazer: vBazer, buddha: vBuddha, arena: vArena, snack: vSnack, projects: vProjects, plannotator: vPl, history: vHist }[TAB] || vDash)();
  document.getElementById('view').innerHTML = v;
  document.querySelectorAll('#nav > button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  renderNavModes();
  renderNavSub();
  if(TAB === 'pstack'){ if(!MS) initMS(); renderMS(); }
  if(TAB === 'buddha' || TAB === 'arena'){ if(!ROLES) parseRoles(); renderRoleChips(); }
  setVerifyBadge();
}

function verifyPanel(){
  if(!VERIFY) return '';
  const s = VERIFY.summary || {};
  const rows = VERIFY.items.map(i => `
    <div class="vrow">${led(i.level)}<div><b>${esc(i.label)}</b><div class="small muted">${esc(i.detail||'')}</div></div></div>`).join('');
  return `<div class="card">
    <h3>ผลตรวจความครบ</h3>
    <div class="row" style="margin-bottom:6px">
      <span class="badge ok">ผ่าน ${s.ok||0}</span>
      <span class="badge warn">เตือน ${s.warn||0}</span>
      <span class="badge red">ไม่ผ่าน ${s.fail||0}</span>
      <span class="muted xs">ตรวจเมื่อ ${esc(VERIFY.at||'')}</span>
    </div>
    <div class="verify-list">${rows}</div>
  </div>`;
}

function vDash(){
  const L = MODE_LABEL[S.lock.mode] || MODE_LABEL['none'];
  return `
  <div class="grid">
    <div class="card"><h3>Server 4096</h3>
      <div class="row">${led(S.server.up?'ok':'fail')}<span class="big">${S.server.up?'ทำงานอยู่':'ปิดอยู่'}</span></div>
      <div class="sub">เวอร์ชัน ${esc(S.server.version||'—')} · CLI ${esc(S.opencodeCli||'—')}${S.server.mismatch?' ⚠ ไม่ตรงกัน':''}${S.server.pinned?' · ปักหมุด v1 (ตั้งใจ)':''}</div>
      ${S.server.mismatch ? '<div class="warnbox mt">เวอร์ชัน server ไม่ตรงกับ CLI — server อาจยังรันตัวเก่า ล็อกบางอย่าง (เช่น blacklist บน V2) อาจมีพฤติกรรมต่าง</div>' : ''}
    </div>
    <div class="card"><h3>โหมดล็อก</h3>
      <div class="row">${led(L[1])}<span class="big">${esc(L[0])}</span></div>
      <div class="sub">${S.lock.blacklist.length} โมเดลถูกบล็อก · provider: ${esc((S.lock.enabledProviders||[]).join(', ') || '—')}</div>
    </div>
    <div class="card"><h3>โมเดลเริ่มต้น</h3>
      <div class="row"><span class="big mono">${esc(S.model.current||'—')}</span></div>
      <div class="sub">effort: ${esc(S.model.effort||'—')} · model.json: ${esc(S.model.modelJsonVariant||'—')}${S.model.mismatch?' ⚠':''}</div>
      ${S.model.mismatch ? '<div class="warnbox mt">model.json (variant ที่กดใน TUI) ทับ config — มีปุ่มซิงค์ในแท็บ "ล็อก & โมเดล"</div>' : ''}
    </div>
    <div class="card"><h3>Skills</h3>

function bpRow(f){ const m = {new:['gold','ใหม่'], diff:['warn','ต่าง'], same:['','เหมือน'], exists:['','มีอยู่ (จะไม่ทับ)']}; const [cls,label] = m[f.status] || ['', f.status]; return `<tr><td class="mono small">${esc(f.path)}</td><td><span class="badge ${cls}">${label}</span></td></tr>`; }

const ROLE_LIST = [
  'feature, refactoring', 'bug-fix', 'perf-issue', 'hillclimb',
  'judgment and prose', 'hardest tasks',
  'how explorer', 'how explainer', 'why investigators', 'why synthesizer',
  'reflect tooling', 'reflect judgment, divergent, synthesizer',
  'arena runners', 'arena cross-judge pool',
  'swarm workers', 'architect runners', 'interrogate reviewers',
];
const QUICK_MODELS = [
  'opencode-go/deepseek-v4.1-flash',
  'opencode-go/beam-free',
  'opencode-go/muse-spark-1.3-contributor',
  'opencode-go/longcat-2.5-preview-free',
];
const ROLE_RE = /^[a-z][a-z0-9, -]*$/;
function initMS(){
  const txt = (S.models2 && S.models2.content) || '';
  const custom = {}; const extra = []; let budget = 'large';
  for(const line of txt.split(/\r?\n/)){
    const l = line.trim();
    if(!l) continue;
    if(l.startsWith('#')){ const b = l.match(/^#\s*budget:\s*(\w+)/); if(b && ['unlimited','large','medium','small'].includes(b[1])) budget = b[1]; continue; }
    const i = l.indexOf(':');
    if(i <= 0) continue;
    const role = l.slice(0, i).trim();
    const models = l.slice(i + 1).trim();
    if(!role || role.length > 60 || !ROLE_RE.test(role)) continue;
    custom[role] = models;
    if(!ROLE_LIST.includes(role) && !extra.includes(role)) extra.push(role);
  }
  const sets = (S.modelSets || []).map(s => ({
    name: String(s.name || 'ชุดใหม่'),
    models: Array.isArray(s.models) ? s.models.slice() : [],
    roles: Array.isArray(s.roles) ? s.roles.filter(r => r).slice() : [],
  }));
  MS = { budget, sets, custom, extraRoles: extra };
  for(const s of sets) for(const r of s.roles) if(s.models.length) MS.custom[r] = s.models.join(', ');
}
function ownerOf(role){ return MS.sets.find(s => s.roles.includes(role)) || null; }
function allRoleNames(){
  const owned = MS.sets.flatMap(s => s.roles);
  return [...new Set([...ROLE_LIST, ...(MS.extraRoles || []), ...owned])];
}
function quickBtns(target, present){
  const arr = present || [];
  return QUICK_MODELS.map(m => {
    const short = m.split('/').pop();
    if(arr.includes(m)) return `<button class="btn sm" disabled title="${esc(m)} — มีอยู่แล้ว">✓ ${esc(short)}</button>`;
    return `<button class="btn sm ghost" data-act="ms-quick" data-t="${esc(target)}" data-model="${esc(m)}" title="${esc(m)}">⚡ ${esc(short)}</button>`;
  }).join(' ');
}

        </div>
        <div class="flex mt"><span class="small muted">Quick Select:</span>${quickBtns('set:' + i, s.models)}</div>
        ${warn}
        <div class="section-title mt">Functions ที่ชุดนี้ดูแล <span class="small muted">— คลิกเพื่อเปิด/ปิด · ชิปที่ขึ้นชื่อชุดอื่น = คลิกเพื่อย้ายมา</span></div>
        <div class="chips mt">${roleChips}</div>
      </div>`;
    }).join('') || '<div class="muted small">ยังไม่มีชุดโมเดล — กด "+ สร้างชุดใหม่" เพิ่มโมเดล แล้วเลือก function ให้ชุดนั้นดูแล</div>';
  }
  const cb = document.getElementById('msCustom');
  if(cb && MS){
    const free = allRoleNames().filter(r => !ownerOf(r));
    cb.innerHTML = free.map(r => `
      <div class="flex" style="margin-top:6px">
        <span class="mono small" style="width:330px">${esc(r)}</span>

      </div>`).join('') || '<div class="muted small">ทุก function ถูกดูแลโดยชุดแล้ว 🎉</div>';
  }
  const b = document.getElementById('pmBudget');
  if(b && MS) b.value = MS.budget;

function parseRoles(){
  const txt = (S.models2 && S.models2.content) || '';
  const out = { 'arena runners': [], 'arena cross-judge pool': [] };
  for(const line of txt.split(/\r?\n/)){
    const i = line.indexOf(':');
    if(i < 0) continue;
    const r = line.slice(0, i).trim();
    if(out[r]) out[r] = line.slice(i + 1).split(',').map(s => s.trim()).filter(Boolean);
  }
  ROLES = out;
}
const ROLE_LABEL = {
  'arena runners': 'รันเนอร์ — โมเดลที่แข่งกัน (ใส่ได้หลายตัว)',

function renderRoleChips(){

/* ---------- events ---------- */

document.addEventListener('input', e => {
  if(e.target.tagName === 'TEXTAREA') e.target.dataset.dirty = '1';
  if(e.target.id === 'skFilter'){ FILTER = e.target.value; const l = document.getElementById('skillList'); if(l) l.innerHTML = skillRows(); }
});

document.addEventListener('change', e => {
  if(e.target.classList && e.target.classList.contains('ms-name')){
    const s = MS && MS.sets[+e.target.dataset.i];
    if(s){ s.name = e.target.value.trim() || s.name; saveSets(); }
    return;
  }
  const t = e.target.closest('[data-act]');
  if(!t || t.tagName !== 'INPUT') return;
  if(t.dataset.act === 'autostart') act('autostart', { on: t.checked });
  else if(t.dataset.act === 'pl-toggle') act('plannotator-toggle', { enable: t.checked }, 'สลับปลั๊กอิน Plannotator ใน global config?');
  else if(t.dataset.act === 'agent-toggle') act('agent-toggle', { file: t.dataset.file, enable: t.checked }, 'สลับสถานะ agent นี้?');
});

document.addEventListener('click', async e => {
  const navBtn = e.target.closest('#nav button[data-tab]');
  if(navBtn){
    if(navBtn.dataset.tab !== TAB && anyDirty() && !confirm('มีการแก้ไขที่ยังไม่บันทึกในแท็บนี้ — เปลี่ยนแท็บแล้วทิ้งการแก้ไข?')) return;
    if(TAB === 'pstack') collectMS();
    tab(navBtn.dataset.tab); return;
  }
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(t.tagName === 'INPUT') return; // checkbox จัดการผ่าน change event
  const a = t.dataset.act;
  switch(a){
    case 'refresh': if(anyDirty() && !confirm('มีการแก้ไขที่ยังไม่บันทึก — รีเฟรชแล้วทิ้งการแก้ไข?')) break; if(TAB === 'pstack') collectMS(); refresh(); break;
    case 'verify': runVerify(); break;
    case 'lock-mode': {
      const mode = t.dataset.mode, restart = document.getElementById('lockRestart')?.checked;
      const label = MODE_LABEL[mode]?.[0] || mode;
      act('set-lock', { mode, restart }, `เปลี่ยนเป็น "${label}"${restart?' และรีสตาร์ท server':''}?`);
      break;
    }
    case 'bl-fetch': {
      try{ const r = await api('/api/action', { post: { id:'list-models' } }); MODELS = r.models || []; toast('ดึงได้ ' + MODELS.length + ' โมเดล'); render(); }
      catch(err){ toast('ดึงไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'bl-add': {
      const v = document.getElementById('blSelect')?.value;
      if(v) act('update-blacklist', { add:[v] });
      break;
    }
    case 'bl-del': act('update-blacklist', { remove:[t.dataset.m] }, `ปลดบล็อกโมเดล ${t.dataset.m}?`); break;
    case 'model-save': act('set-model-effort', {
      model: document.getElementById('mModel').value.trim(),
      effort: document.getElementById('mEffort').value,
      sync: document.getElementById('mSync').checked,
    }); break;
    case 'srv-health': act('health-check'); break;
    case 'srv-restart': act('restart-server', {}, 'รีสตาร์ท server 4096? (Cline ที่กำลังทำงานอยู่อาจสะดุดชั่วครู่)'); break;
    case 'srv-service': act('restart-service', {}, 'รีสตาร์ท opencode service?'); break;
    case 'autostart': act('autostart', { on: t.checked }); break;
    case 'copy-cline': { try{ await navigator.clipboard.writeText(S.model.current||''); toast('คัดลอกแล้ว'); }catch{ toast('คัดลอกไม่สำเร็จ', true); } break; }
    case 'copy-agent': {
      const n = t.dataset.agent || '';
      const isSub = t.dataset.sub === '1';
      try{
        if(isSub){ await navigator.clipboard.writeText(n); toast('คัดลอก id แล้ว — ใช้เป็น agent id ตอนเรียก subagent ผ่านเครื่องมือ subagent'); }
        else { await navigator.clipboard.writeText(`opencode run --agent ${n} "โจทย์ของคุณ"`); toast('คัดลอกแล้ว — หรือกด Tab เลือกโหมดใน TUI'); }
      }catch{ toast('คัดลอกไม่สำเร็จ', true); }
      break;
    }
    case 'cli-save': act('save-text', { target:'cli', content: document.getElementById('cliJson').value }); break;
    case 'build-preview': {
      try{ BP = await api('/api/action', { post: { id:'build-preview' } }); render(); }
      catch(err){ toast('ดู diff ไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'build-apply': {
      const parts = { skills: document.getElementById('bpSkills').checked, agents: document.getElementById('bpAgents').checked, commands: document.getElementById('bpCommands').checked, config: document.getElementById('bpConfig').checked };
      const cleanup = document.getElementById('bpCleanup')?.checked || false;
      act('build-apply', { parts, cleanup }, 'Apply ชุด build ทับของเดิม? (สำรองอัตโนมัติก่อนทุกไฟล์)');
      break;
    }
    case 'skill-hide': act('skill-hide', { name: t.dataset.name }); break;
    case 'skill-show': act('skill-show', { name: t.dataset.name }); break;
    case 'skill-field': act('skill-remove-field', { name: t.dataset.name }, 'ลบฟิลด์ disable-model-invocation ออกจาก skill นี้?'); break;
    case 'pm-save': {
      MS = null; ROLES = null;
      act('save-text', { target:'pstack-models', content: document.getElementById('pmText').value });
      break;
    }
    case 'ms-new-set': {
      if(!MS) initMS();
      collectMS();
      MS.sets.push({ name: 'ชุด ' + (MS.sets.length + 1), models: [], roles: [] });
      renderMS(); saveSets();
      break;
    }
    case 'ms-del-set': {
      if(!MS) break;
      const s = MS.sets[+t.dataset.i];
      if(!s) break;
      if(!confirm(`ลบชุด "${s.name}"? — function ที่ชุดนี้ดูแลจะกลับเป็น "กำหนดเอง"`)) break;
      for(const r of s.roles) if(s.models.length) MS.custom[r] = s.models.join(', ');
      MS.sets.splice(+t.dataset.i, 1);
      renderMS(); saveSets();
      break;
    }
    case 'ms-model-add': {
      if(!MS) break;
      const i = +t.dataset.i, s = MS.sets[i];
      const inp = document.querySelector(`.ms-add[data-i="${i}"]`);
      const v = (inp?.value || '').trim();
      if(s && v && !s.models.includes(v)){ s.models.push(v); if(inp) inp.value = ''; }
      if(s) for(const r of s.roles) MS.custom[r] = s.models.join(', ');
      renderMS(); saveSets();
      break;
    }
    case 'ms-model-del': {
      const s = MS && MS.sets[+t.dataset.i];
      if(s){ s.models.splice(+t.dataset.j, 1); for(const r of s.roles) MS.custom[r] = s.models.join(', '); renderMS(); saveSets(); }
      break;
    }
    case 'ms-quick': {
      const tgt = t.dataset.t || '', m = t.dataset.model || '';
      if(tgt.startsWith('set:')){
        if(!MS) break;
        const s = MS.sets[+tgt.slice(4)];
        if(s && m && !s.models.includes(m)){ s.models.push(m); for(const r of s.roles) MS.custom[r] = s.models.join(', '); }
        renderMS(); saveSets();
      } else if(tgt.startsWith('role:')){
        if(!ROLES) parseRoles();
        const role = tgt.slice(5);
        if(ROLES[role] && m){
          if(!ROLES[role].includes(m)){ ROLES[role].push(m); toast('เพิ่ม ' + m + ' แล้ว — กด "บันทึก" เพื่อเขียนลงไฟล์'); }
          else { toast('มี ' + m + ' อยู่แล้ว'); }
          renderRoleChips();
        }
      }
      break;
    }
    case 'ms-role-toggle': {
      if(!MS) break;
      const s = MS.sets[+t.dataset.i], role = t.dataset.role;
      if(!s || !role) break;
      const cur = ownerOf(role);
      if(cur === s){ s.roles = s.roles.filter(r => r !== role); }
      else {
        if(cur){ cur.roles = cur.roles.filter(r => r !== role); toast(`ย้าย "${role}" จากชุด "${cur.name}" → "${s.name}"`); }
        s.roles.push(role);
        if(s.models.length) MS.custom[role] = s.models.join(', ');
      }
      renderMS(); saveSets();
      break;
    }
    case 'ms-make-set': {
      if(!MS) initMS();
      collectMS();
      const role = t.dataset.role;
      const val = (MS.custom[role] || '').split(',').map(x => x.trim()).filter(Boolean);
      const nm = prompt('ตั้งชื่อชุดใหม่สำหรับ "' + role + '":', role.slice(0, 24));
      if(nm === null) break;
      const cur = ownerOf(role); if(cur) cur.roles = cur.roles.filter(r => r !== role);
      MS.sets.push({ name: (nm.trim() || role.slice(0, 24)), models: val, roles: [role] });
      renderMS(); saveSets();
      break;
    }
    case 'ms-reset': { MS = null; ROLES = null; if(TAB === 'pstack'){ initMS(); renderMS(); } break; }
    case 'ms-save': {
      if(!MS) initMS();
      collectMS();
      const rows = []; const seen = new Set();
      for(const s of MS.sets){
        for(const r of s.roles){
          if(seen.has(r)) continue;
          seen.add(r);
          if(s.models.length) rows.push({ role: r, models: s.models.join(', ') });
        }
      }
      for(const r of allRoleNames()){
        if(seen.has(r)) continue;
        seen.add(r);
        const v = (MS.custom[r] || '').trim();
        if(v) rows.push({ role: r, models: v });
      }
      for(const s of MS.sets) for(const r of s.roles){ if(s.models.length) MS.custom[r] = s.models.join(', '); }
      act('save-pstack-models', { budget: MS.budget, rows });
      break;
    }
    case 'amodels-fetch': {
      try{ const r = await api('/api/action', { post: { id:'list-avail-models' } }); AMODELS = r.models || []; toast(r.message || ('ได้ ' + AMODELS.length + ' โมเดล')); render(); }
      catch(err){ toast('ดึงรายชื่อไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'pj-scan': {
      try{ const r = await api('/api/action', { post: { id:'scan-projects' } }); toast(r.message || 'สแกนเสร็จ'); await refresh(); }
      catch(err){ toast('สแกนไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'pj-toggle': act('project-agent-toggle', { file: t.dataset.file, enable: t.dataset.en === '1' }, 'สลับสถานะ agent ในโปรเจกต์นี้?'); break;
    case 'pj-del': act('project-agent-del', { file: t.dataset.file }, 'ลบ agent ในโปรเจกต์นี้? (สำรองไว้ — กู้ได้ในแท็บประวัติ)'); break;
    case 'pj-add': {
      const sel = t.closest('.flex')?.querySelector('.pj-add');
      if(sel && sel.value) act('project-agent-add', { root: t.dataset.root, name: sel.value });
      break;
    }
    case 'pj-init': act('project-init', { root: t.dataset.root }, 'ติดตั้ง .opencode เริ่มต้น (agents ชุด pStack + AGENTS.md + opencode.json) ในโปรเจกต์นี้?'); break;
    case 'setup-preview': {
      try{ SETUP = await api('/api/action', { post: { id:'setup-preview' } }); renderSetupBox(); }
      catch(err){ toast('พรีวิวไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'setup-quick': {
      try{
        const pv = await api('/api/action', { post: { id:'setup-preview' } });
        const steps = pv.steps.filter(s => s.will).map(s => s.id);
        if(!steps.length){ toast('ทุกอย่างตั้งไว้ครบแล้ว — ไม่มีอะไรต้องติดตั้ง'); break; }
        if(!confirm('ติดตั้ง ' + steps.length + ' ขั้นตอน: ' + steps.join(', ') + ' ?')) break;
        const r = await api('/api/action', { post: { id:'setup-apply', steps } });
        toast(r.message || 'ติดตั้งเสร็จ'); await refresh(); runVerify(false);
      }catch(err){ toast('ติดตั้งไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'setup-run': {
      const steps = [...document.querySelectorAll('.su-step:checked')].map(x => x.dataset.id);
      if(!steps.length){ toast('ยังไม่ได้เลือกขั้นตอน'); break; }
      act('setup-apply', { steps, overwrite: document.getElementById('suOverwrite')?.checked || false, autostart: document.getElementById('suAutostart')?.checked || false }, 'ติดตั้ง ' + steps.length + ' ขั้นตอนที่เลือก?');
      break;
    }
    case 'update-check': {
      try{ UP = await api('/api/action', { post: { id:'update-check' } }); toast(UP.message || 'ตรวจแล้ว'); render(); }
      catch(err){ toast('ตรวจไม่สำเร็จ: ' + err.message, true); }
      break;
    }
    case 'update-run': {
      if(!UP){
        try{ UP = await api('/api/action', { post: { id:'update-check' } }); }catch(err){ toast('ตรวจไม่สำเร็จ: ' + err.message, true); break; }
        if(!UP.counts || (!UP.counts.new && !UP.counts.diff)){ toast('ทุกอย่างเป็นเวอร์ชันล่าสุดอยู่แล้ว'); render(); break; }
      }
      UP = null;
      act('update-apply', {}, 'อัพเดตทับไฟล์ที่ต่าง/ใหม่ทั้งหมด? (สำรองอัตโนมัติก่อนทุกไฟล์)');
      break;
    }
    case 'agent-save': {
      const ta = t.closest('details')?.querySelector('.agent-edit') || (t.closest('.card')?.querySelector('.agent-edit'));
      if(!ta){ toast('ไม่พบช่องแก้ไข', true); break; }
      act('save-agent', { file: ta.dataset.file, content: ta.value });
      break;
    }
    case 'role-add': {
      if(!ROLES) parseRoles();
      const role = t.dataset.role;
      const inp = document.querySelector(`.role-add[data-role="${role}"]`);
      const v = (inp?.value || '').trim();
      if(v && ROLES[role] && !ROLES[role].includes(v)){ ROLES[role].push(v); if(inp) inp.value = ''; }
      renderRoleChips();
      break;
    }
    case 'role-del': {
      if(!ROLES) parseRoles();
      const role = t.dataset.role;
      if(ROLES[role]) ROLES[role].splice(+t.dataset.j, 1);
      renderRoleChips();
      break;
    }
    case 'role-save': {
      if(!ROLES) parseRoles();
      const role = t.dataset.role;
      const inp = document.querySelector(`.role-add[data-role="${role}"]`);
      const v = (inp?.value || '').trim();
      if(v && ROLES[role] && !ROLES[role].includes(v)){ ROLES[role].push(v); if(inp) inp.value = ''; }
      act('pm-role-save', { role, models: ROLES[role] || [] });
      break;
    }
    case 'roles-reset': { ROLES = null; parseRoles(); renderRoleChips(); toast('โหลดค่าจากไฟล์ใหม่แล้ว'); break; }
    case 'legacy-migrate': act('pm-legacy-migrate', {}, 'ย้ายค่า bazer arena runners ไป arena runners?'); break;
    case 'legacy-del': act('pm-legacy-del', {}, 'ลบบรรทัดเก่า bazer arena runners?'); break;
    case 'mirror-run': act('mirror-agents', {}, 'อัพเดต mirror โหมด → skills (สำรองก่อนเขียนทุกไฟล์)?'); break;
    case 'install-agent': act('install-agent', { file: t.dataset.file }, `ติดตั้ง ${t.dataset.file} จาก bundle เข้าเครื่อง?`); break;
    case 'copy-bazer': {
      try{ await navigator.clipboard.writeText('opencode run --agent bazer "โจทย์ของคุณ"'); toast('คัดลอกแล้ว — หรือกด Tab เลือก Bazer ใน TUI'); }
      catch{ toast('คัดลอกไม่สำเร็จ', true); }
      break;
    }
    case 'copy-snack': {
      try{ await navigator.clipboard.writeText('opencode run --agent snack "โจทย์ของคุณ"'); toast('คัดลอกแล้ว — หรือกด Tab เลือก Snack ใน TUI'); }
      catch{ toast('คัดลอกไม่สำเร็จ', true); }
      break;
    }
    case 'pl-cfg-save': act('save-plannotator-config', { semanticDiff: document.getElementById('plSemantic').checked, callFlow: document.getElementById('plCallFlow').checked }); break;
    case 'pl-cfg-raw-save': act('save-plannotator-config', { raw: document.getElementById('plCfgRaw').value }); break;
    case 'pl-prefs-save': act('save-plannotator-prefs', { content: document.getElementById('plPrefs').value }); break;
    case 'npx-list': act('npx-skills', { op:'list' }); break;
    case 'npx-update': act('npx-skills', { op:'update' }, 'รัน npx skills update -g? (อาจใช้เวลาหลายนาที)'); break;
    case 'agent-toggle': act('agent-toggle', { file: t.dataset.file, enable: t.dataset.en === '1' }, 'สลับสถานะ agent นี้?'); break;
    case 'agent-del': act('agent-del', { file: t.dataset.file }, `ลบ ${t.dataset.file}? (สำรองไว้ก่อน)`); break;
    case 'cmd-toggle': act('command-toggle', { file: t.dataset.file, enable: t.dataset.en === '1' }, 'สลับสถานะคำสั่งนี้?'); break;
    case 'pl-toggle': act('plannotator-toggle', { enable: t.checked }, 'สลับปลั๊กอิน Plannotator ใน global config?'); break;
    case 'pl-clear': act('plannotator', { op:'clear-cache' }, 'ล้าง cache ปลั๊กอิน? (OpenCode จะติดตั้งใหม่ตอนเปิดครั้งถัดไป)'); break;
    case 'pl-version': act('plannotator', { op:'version' }); break;
    case 'open': { try{ await api('/api/action', { post: { id:'open-folder', key: t.dataset.key } }); }catch(err){ toast(err.message, true); } break; }
    case 'bk-restore': act('restore-backup', { set: t.dataset.set }, `กู้คืนชุดสำรอง ${t.dataset.set}?\nไฟล์ปัจจุบันจะถูกสำรองก่อนเขียนทับ`); break;
    default: break;
  }
});

refresh();
setInterval(() => { if(!document.hidden) refreshQuiet(); }, 30000);
async function refreshQuiet(){ if(anyDirty()) return; const ae = document.activeElement; if(ae && ['TEXTAREA','INPUT','SELECT'].includes(ae.tagName)) return; try{ S = await api('/api/state'); render(); }catch{} }
</script>
</body>
